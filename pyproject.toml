[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "tapi-stone-gate0"
version = "0.1.0"
description = "Bootstrap do Gate 0 do TAPI Stone — nenhuma operação externa habilitada"
requires-python = ">=3.11"
dependencies = ["fastapi>=0.120,<1", "pydantic>=2.10,<3", "uvicorn>=0.30,<1"]

[project.optional-dependencies]
dev = ["pytest>=8,<10", "httpx>=0.27,<1", "jsonschema>=4,<5"]

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-ra"
